<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Night Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#023b82" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Building Gradients -->
    <!-- Back Buildings -->
    <linearGradient id="backBldg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#083366" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#075985" stop-opacity="0.9" />
    </linearGradient>
    
    <!-- Mid Buildings -->
    <linearGradient id="midBldg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Front Buildings -->
    <linearGradient id="frontBldg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Soft Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="400" fill="url(#skyGrad)" />

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="50" r="1.5" opacity="0.8" />
    <circle cx="150" cy="90" r="1" opacity="0.6" />
    <circle cx="230" cy="40" r="2" opacity="0.9" />
    <circle cx="340" cy="110" r="1" opacity="0.5" />
    <circle cx="450" cy="60" r="1.5" opacity="0.8" />
    <circle cx="580" cy="80" r="1" opacity="0.7" />
    <circle cx="700" cy="40" r="2.5" opacity="0.9" />
    <circle cx="820" cy="100" r="1" opacity="0.5" />
    <circle cx="940" cy="50" r="1.5" opacity="0.8" />
    <circle cx="1060" cy="90" r="2" opacity="0.7" />
    <circle cx="1140" cy="60" r="1" opacity="0.6" />
  </g>

  <!-- Clouds -->
  <g fill="url(#cloudGrad)">
    <!-- Cloud 1 Left -->
    <path d="M -50 150 Q 20 100 90 140 Q 160 110 230 150 Q 280 180 280 200 L -50 200 Z" />
    <!-- Cloud 2 Right -->
    <path d="M 900 120 Q 980 80 1050 110 Q 1120 70 1190 120 Q 1240 140 1250 160 L 900 160 Z" />
  </g>

  <!-- Back Building Layer (Silhouette) -->
  <g fill="url(#backBldg)">
    <rect x="50" y="160" width="80" height="240" />
    <polygon points="50,160 90,120 130,160" />
    
    <rect x="180" y="200" width="90" height="200" />
    
    <rect x="320" y="140" width="70" height="260" />
    <rect x="350" y="100" width="10" height="40" /> <!-- Spire -->
    
    <rect x="470" y="180" width="110" height="220" />
    <path d="M 470 180 Q 525 140 580 180 Z" /> <!-- Domed Back building -->

    <rect x="680" y="150" width="90" height="250" />
    <polygon points="680,150 725,100 770,150" />

    <rect x="830" y="210" width="80" height="190" />
    
    <rect x="960" y="130" width="80" height="270" />
    <rect x="995" y="80" width="10" height="50" /> <!-- Spire -->
  </g>

  <!-- Mid Building Layer -->
  <g fill="url(#midBldg)">
    <rect x="20" y="220" width="70" height="180" />
    
    <rect x="110" y="180" width="90" height="220" />
    <!-- Yellow Windows for Building 2 -->
    <g fill="#fef08a" opacity="0.8">
      <rect x="130" y="200" width="12" height="18" rx="2" />
      <rect x="160" y="200" width="12" height="18" rx="2" />
      <rect x="130" y="240" width="12" height="18" rx="2" />
      <rect x="160" y="240" width="12" height="18" rx="2" />
      <rect x="130" y="280" width="12" height="18" rx="2" />
      <rect x="160" y="280" width="12" height="18" rx="2" />
    </g>

    <rect x="250" y="240" width="80" height="160" />
    
    <rect x="390" y="170" width="100" height="230" />
    <path d="M 390 170 L 440 120 L 490 170 Z" />
    <g fill="#e0f2fe" opacity="0.6">
      <rect x="410" y="190" width="15" height="25" />
      <rect x="415" y="230" width="15" height="25" />
      <rect x="455" y="190" width="15" height="25" />
      <rect x="455" y="230" width="15" height="25" />
    </g>

    <rect x="600" y="200" width="100" height="200" />
    <!-- Windows -->
    <g fill="#fef08a" opacity="0.9">
      <circle cx="630" cy="230" r="6" />
      <circle cx="670" cy="230" r="6" />
      <circle cx="630" cy="260" r="6" />
      <circle cx="670" cy="260" r="6" />
      <circle cx="630" cy="290" r="6" />
      <circle cx="670" cy="290" r="6" />
    </g>

    <rect x="750" y="230" width="90" height="170" />
    
    <rect x="890" y="190" width="90" height="210" />
    <g fill="#e0f2fe" opacity="0.8">
      <rect x="910" y="210" width="15" height="20" />
      <rect x="945" y="210" width="15" height="20" />
      <rect x="910" y="250" width="15" height="20" />
      <rect x="945" y="250" width="15" height="20" />
    </g>

    <rect x="1060" y="220" width="80" height="180" />
  </g>

  <!-- Front Building Layer -->
  <g fill="url(#frontBldg)">
    <!-- Building 1 Left -->
    <rect x="0" y="260" width="60" height="140" />
    
    <!-- Building 2 Left (Rounded top) -->
    <rect x="70" y="220" width="90" height="180" rx="10" />
    <g fill="#ffffff" opacity="0.9">
      <rect x="90" y="250" width="14" height="25" rx="3" />
      <rect x="125" y="250" width="14" height="25" rx="3" />
      <rect x="90" y="290" width="14" height="25" rx="3" />
      <rect x="125" y="290" width="14" height="25" rx="3" />
    </g>

    <!-- Diagonal roof building -->
    <path d="M 200 280 L 290 230 L 290 400 L 200 400 Z" />
    <g fill="#fef08a" opacity="0.9">
      <rect x="220" y="300" width="12" height="15" transform="rotate(-10 220 300)" />
      <rect x="250" y="290" width="12" height="15" transform="rotate(-10 250 290)" />
    </g>

    <!-- Center Bridge (Stylized Bridge Arc) -->
    <path d="M 280 400 C 350 280, 500 280, 570 400 L 530 400 C 470 320, 380 320, 320 400 Z" fill="#0284c7" opacity="0.9"/>
    
    <!-- Building Center-Right -->
    <rect x="520" y="240" width="100" height="160" />
    <g fill="#ffffff" opacity="0.95">
      <rect x="540" y="260" width="15" height="15" />
      <rect x="565" y="260" width="15" height="15" />
      <rect x="540" y="290" width="15" height="15" />
      <rect x="565" y="290" width="15" height="15" />
    </g>

    <!-- Super Tall Front Tower -->
    <rect x="650" y="160" width="80" height="240" />
    <path d="M 650 160 L 690 100 L 730 160 Z" />
    <g fill="#e0f2fe" opacity="0.9">
      <rect x="670" y="180" width="10" height="40" />
      <rect x="700" y="180" width="10" height="40" />
      <rect x="670" y="240" width="10" height="40" />
      <rect x="700" y="240" width="10" height="40" />
      <rect x="670" y="300" width="10" height="40" />
      <rect x="700" y="300" width="10" height="40" />
    </g>

    <!-- Right Side Buildings -->
    <rect x="800" y="250" width="90" height="150" />
    <g fill="#fef08a" opacity="0.9">
      <circle cx="825" cy="280" r="5" />
      <circle cx="865" cy="280" r="5" />
      <circle cx="825" cy="310" r="5" />
      <circle cx="865" cy="310" r="5" />
    </g>

    <!-- Diagonal roof building Right -->
    <path d="M 920 220 L 1000 260 L 1000 400 L 920 400 Z" />
    
    <!-- Building 5 Right -->
    <rect x="1020" y="200" width="110" height="200" rx="8" />
    <g fill="#ffffff" opacity="0.85">
      <rect x="1045" y="220" width="16" height="30" rx="2" />
      <rect x="1075" y="220" width="16" height="30" rx="2" />
      <rect x="1045" y="270" width="16" height="30" rx="2" />
      <rect x="1075" y="270" width="16" height="30" rx="2" />
    </g>
    
    <!-- Bridge Right -->
    <path d="M 1120 400 C 1150 350, 1200 350, 1220 400 Z" fill="#0284c7" opacity="0.8"/>
  </g>
</svg>
