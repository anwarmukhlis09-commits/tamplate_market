<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point Coffee - Logout</title>
    <!-- Menghubungkan ke Stylesheet Lokal untuk Kemampuan Offline 100% -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BAGIAN ATAS: LOGO BRAND -->
    <header>
        <div class="logo-wrapper">
            <div class="logo-container">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.25 8.25 0 0 1 12 21 8.25 8.25 0 0 1 6.038 7.047 8.287 8.287 0 0 0 9 9.601a8.983 8.983 0 0 1 3.361-6.867 8.21 8.21 0 0 0 3 2.48Z" />
                </svg>
            </div>
            <div>
                <h1 class="brand-title">Point Coffee</h1>
                <p class="brand-subtitle">Premium Hotspot Portal</p>
            </div>
        </div>
    </header>

    <!-- BAGIAN TENGAH: LOGOUT CARD -->
    <main class="main-card">
        <div class="logout-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
            </svg>
        </div>
        
        <div class="card-header" style="margin-bottom: 16px;">
            <h2 class="receipt-title">Sesi Selesai</h2>
            <p class="card-desc">Terima kasih telah menggunakan layanan hotspot Point Coffee.</p>
        </div>

        <div class="receipt-table" style="margin-bottom: 20px;">
            <div class="receipt-row">
                <span class="row-label">User terputus</span>
                <span class="row-value font-bold">$(username)</span>
            </div>
            <div class="receipt-row">
                <span class="row-label">Total Uptime</span>
                <span class="row-value highlight">$(uptime)</span>
            </div>
        </div>

        <!-- Tombol Masuk Kembali -->
        <a href="$(link-login)" class="btn-back" style="text-align: center;">
            MASUK KEMBALI
        </a>
    </main>

    <!-- FOOTER -->
    <footer>
        &copy; 2026 Point Coffee Hotspot. All Rights Reserved.
    </footer>

</body>
</html>
